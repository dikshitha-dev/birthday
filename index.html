<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Sriracha&family=Dancing+Script:wght@700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <div class="bunting"><svg viewBox="0 0 1000 70" preserveAspectRatio="none" id="bunt"></svg></div>

  <div class="content">
    <div class="left">
      <div class="title">
        <h1 class="h1" id="t1"></h1>
        <h1 class="h2" id="t2"></h1>
        <div class="hat">🎩</div>
      </div>
      <div class="date" id="date"></div>
      <div class="btn"><button id="open">Click here ✉️</button></div>
    </div>

    <div class="right">
      <div class="rise">
        <div class="photo" id="photo" >
          <img alt="Sirrulu" src="assets/images/cover.jpg" style="display:block">
        </div>
                <div class="name"><span class="hrt">♥</span><span id="nm"></span><span class="hrt">♥</span></div>
        <div class="balloon b1">🎈</div>
        <div class="balloon b2">🎈</div>
      </div>
    </div>
  </div>

  <div class="badge"><div class="ring" id="ring"></div><span class="hrt">♥</span></div>
  <div class="star" style="width:20px;height:20px;top:90px;left:30%;--t:7s"></div>
  <div class="star" style="width:16px;height:16px;top:60px;right:30%;--t:7.2s"></div>
  <div class="star" style="width:14px;height:14px;top:50%;left:48%;--t:7.4s"></div>
  <div class="star" style="width:18px;height:18px;bottom:60px;left:30px;--t:7.6s"></div>
  <div class="star" style="width:16px;height:16px;bottom:150px;left:55%;--t:7.8s"></div>
  <div class="deco" style="top:36%;left:4%;--t:7s">🌸</div>
  <div class="deco" style="top:28%;left:46%;--t:7.3s">🌸</div>
  <div class="deco" style="top:20%;right:20%;--t:7.6s">🌸</div>
    <div class="cake">🧁</div>

  <div id="overlay">
    <div id="card">
      <div class="letter">
        <div id="lt"></div>
        <div class="lbody">
          <div class="l" id="lleft"><img class="big letterpic" alt="" src="assets/images/side-photo.jpg">
            <span class="mini m1" style="--d:.2s">♥</span><span class="mini m2" style="--d:.4s">♥</span>
            <span class="mini m3" style="--d:.6s">♥</span><span class="mini m4" style="--d:.8s">♥</span></div>
          <div class="r"><p id="txt"></p></div>
        </div>
        <h2 class="rh">🎀 19 Reasons Why You Are So Special To Me 🎀</h2>
        <div id="reasons"></div>
        <div class="hpanel"><div id="hwrap"><div id="ui"></div></div></div>
        <p class="sign">Forever yours ♥</p>
      </div>
      <button id="close" aria-label="Close">✕</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/script.js"></script>
</body>
</html>
